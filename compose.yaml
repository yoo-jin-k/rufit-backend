services:
  postgres:
    image: postgres:17
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_DB: rufit
      POSTGRES_USER: rufit
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    volumes:
      - rufit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rufit -d rufit']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rufit-postgres:
