spring.application.name=rufit-backend
server.address=127.0.0.1
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/rufit}
spring.datasource.username=${DB_USERNAME:rufit}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=32
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never

springdoc.api-docs.enabled=${RUFIT_API_DOCS_ENABLED:false}
springdoc.use-fqn=true
springdoc.paths-to-match=/api/v1/**
springdoc.default-produces-media-type=application/json
springdoc.api-docs.version=OPENAPI_3_0

rufit.allowed-origins=${RUFIT_ALLOWED_ORIGINS:}
